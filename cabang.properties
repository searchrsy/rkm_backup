# ==========================================================================
#  SATU-SATUNYA FILE YANG DIEDIT PER CABANG
#  Dipakai oleh APK (Gradle) DAN server (PHP). Isi salinan di server
#  harus sama dengan yang dipakai saat build APK.
#
#  Wajib diisi : CABANG_NAMA, SERVER_HOST, API_KEY
#  Sisanya opsional (kosongkan / hapus baris = pakai nilai otomatis).
#  Jangan pakai tanda kutip. Jangan commit file ini ke repo publik.
# ==========================================================================

# ---------- WAJIB ----------
CABANG_NAMA=Batu
SERVER_HOST=numbing-brigade-glacier.ngrok-free.dev
API_KEY=akuseorangkapiten

# ---------- OPSIONAL (otomatis dari CABANG_NAMA jika kosong) ----------
CABANG_KODE=4B
# Otomatis: "RKM SPI <CABANG_NAMA>"
APP_NAME=
# Otomatis: "Stock Point Indogrosir <CABANG_NAMA>"
SUBTITLE=
# Otomatis: "<CABANG_NAMA> - <CABANG_KODE>" huruf besar
LABEL=
# Otomatis: com.aistudio.rkmspi.<cabang_nama>. Cabang Batu yang sudah
# terpasang WAJIB tetap memakai ID lamanya agar update APK tetap jalan.
APPLICATION_ID=com.aistudio.rkmspibatu.phegdw

# ---------- LOKASI & WAKTU ----------
# WIB = Asia/Jakarta, WITA = Asia/Makassar, WIT = Asia/Jayapura
TIMEZONE=Asia/Jakarta
# Titik tengah peta saat pertama dibuka
MAP_LAT=-7.8712
MAP_LNG=112.5273

# ---------- SERVER ----------
APP_PATH=/sales-gps-dashboard
# Folder penyimpanan foto bukti kunjungan di server
FOTO_DIR=D:/rkm
# Naikkan +1 setiap SERVER_HOST / APP_PATH diganti
CONFIG_VERSION=1
